name: image

# Build and publish the server image to GHCR. The `latest` tag is what the compose file
# names, so `make pull` on the droplet picks up every pushed `main`; the SHA tag exists so
# a bad image can be pinned back by editing one line rather than by reverting and waiting.
# Monthly rebuild for the base image's security updates, the same reasoning the main
# repository's ci-image carries.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Dockerfile"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/image.yml"
  pull_request:
    paths:
      - "src/**"
      - "Dockerfile"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/image.yml"
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Skipped on pull requests, where the build is a check rather than a publish — a fork
      # PR has no write token anyway, so attempting it would fail for a second reason.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/anthers-inc/anthers-obsidian:latest
            ghcr.io/anthers-inc/anthers-obsidian:${{ github.sha }}
          cache-from: type=gha,scope=obsidian-image
          cache-to: type=gha,mode=max,scope=obsidian-image

  # The image is the deliverable; the tests run inside it rather than beside it, so what
  # passes here is what actually ships.
  test-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Run the suite inside the published image
        run: |
          docker run --rm \
            -v "$PWD/src:/app/src" \
            -w /app \
            -e BUN_TEST_KILL_ON_EXIT=1 \
            ghcr.io/anthers-inc/anthers-obsidian:${{ github.sha }} \
            bun test

      - name: Serve a fixture vault and read it back through the boundary
        run: |
          mkdir -p fixture/00-09\ Metafiles/01\ Tasks/Active fixture/Internal\ Wiki
          echo "public" > fixture/Anthers\ Overview.md
          echo "task"   > fixture/00-09\ Metafiles/01\ Tasks/Active/Public\ Task.md
          echo "secret" > fixture/Internal\ Wiki/Internal\ Doc.md
          docker run --rm -d --name obs-verify \
            -v "$PWD/fixture:/vault:ro" -p 13000:3000 \
            ghcr.io/anthers-inc/anthers-obsidian:${{ github.sha }}
          until curl -fsS http://127.0.0.1:13000/health > /dev/null 2>&1; do sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:13000/api/files/Anthers%20Overview.md')" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:13000/api/files/00-09%20Metafiles/01%20Tasks/Active/Public%20Task.md')" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:13000/api/files/Internal%20Wiki/Internal%20Doc.md')" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:13000/api/files/00-09%20Metafiles/not-here.md')" = "404"
          docker rm -f obs-verify > /dev/null
          rm -rf fixture