# SPDX-License-Identifier: Apache-2.0
#
# The publishing stack: the vault-reading server, the sync that feeds it, TLS in front.
#
# 🎚 **The same bundle at two sizes, as with the node bundle.** Anthers running the wiki at
# anthers.wiki and a self-hoster publishing their own vault are this file at two settings:
# the hostname, and the publish boundary they state in the environment. There is no second
# compose file and no second image.
#
# ⚠️ **The services on this stack are deliberately quiet about the network.** The app reads
# `/vault` read-only and binds nothing it does not answer; the sync engine reaches Obsidian
# Sync over outbound HTTPS only — it opens no listening port at all, inbound or GUI, so
# there is nothing on this stack to tunnel into. Caddy answers 80/443 and terminates TLS
# for the one hostname the env file names.
#
#   sudo ./scripts/setup.sh wiki.example.org   # once, before the first `make up`
#   make up                                    # build + start everything
#   make obsidian-login                        # 2FA accounts: interactive login, once
services:
  # ─── The publishing server ───
  app:
    build: .
    image: ghcr.io/anthers-inc/anthers-obsidian:latest
    container_name: anthers-obsidian
    restart: unless-stopped
    depends_on:
      - sync
    env_file:
      # Resolved from the deploy directory: the setup script writes it beside the vault,
      # not inside the repository. OBSIDIAN_DIR is where everything the stack keeps lives.
      - ${OBSIDIAN_DIR:-/srv/anthers-obsidian}/obsidian.env
    volumes:
      # Read-only, always. The server has no write path into the vault by design — the
      # vault on the authoring machines is the only source, and this copy is derived.
      - type: bind
        source: ${OBSIDIAN_DIR:-/srv/anthers-obsidian}/vault
        target: /vault
        read_only: true
    ports:
      # Loopback only — health checks and curling without TLS in front.
      - "127.0.0.1:3000:3000"

  # ─── The sync engine, fed by Obsidian Sync ───
  # obsidian-headless in the house image — the port of Cumulus's implementation,
  # with the publisher's posture (mirror-remote, no config sync, a stated
  # exclusion belt) enforced in the entrypoint. It joins the account as one more
  # device and holds no listening port: outbound HTTPS to Sync is the whole wire.
  sync:
    build: ./obsidian-sync
    image: anthers-obsidian-sync:latest
    container_name: anthers-obsidian-sync
    restart: unless-stopped
    env_file:
      - ${OBSIDIAN_DIR:-/srv/anthers-obsidian}/obsidian.env
    healthcheck:
      # The image has none of its own; the app's deploy verification reads this.
      test: ["CMD", "ob", "sync-status", "--path", "/vaults/Anthers-Wiki"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    volumes:
      - type: bind
        source: ${OBSIDIAN_DIR:-/srv/anthers-obsidian}/vault
        target: /vaults/Anthers-Wiki
      # The CLI's identity — token cache, device registration, the sync database.
      # Mounted so the device survives container recreation instead of
      # re-enrolling under the account every time the stack restarts.
      - type: bind
        source: ${OBSIDIAN_DIR:-/srv/anthers-obsidian}/sync-state
        target: /state

  # ─── TLS, and the only public door ───
  caddy:
    image: caddy:2
    container_name: anthers-obsidian-caddy
    restart: unless-stopped
    depends_on:
      - app
    env_file:
      - ${OBSIDIAN_DIR:-/srv/anthers-obsidian}/obsidian.env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # The Caddyfile the setup script installs beside the vault — the running stack reads
      # the deployed copy, not the repository's.
      - type: bind
        source: ${OBSIDIAN_DIR:-/srv/anthers-obsidian}/caddy/etc/caddy/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config: